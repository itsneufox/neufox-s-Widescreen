; ============================================================================
;  neufox's Widescreen
; ============================================================================
;
;  Most of these can also be changed in game:
;    Options > Display Setup > Advanced > Widescreen Settings
;
;  Settings apply as soon as this file is saved, while the game runs.
;  The few marked [restart] only take effect the next time the game starts.
;
;  1 = on, 0 = off. Sizes are factors: 1.0 is the original size.


; ============================================================================
;  GENERAL
; ============================================================================

[General]
; Master switch. 0 turns the whole fix off: the original, stretched game.
Widescreen = 1

; Screen shape: auto (from the window), or a ratio such as 16:9, 21:9 or 2.37.
; Only needed for unusual setups.
AspectRatio = auto

; Menu and HUD text gets a smooth, round outline instead of the original shadow
; and blocky edge. Never affects SA-MP textdraws.
TextOutline = 1

; SA-MP textdraws on screens wider than 16:9 (narrower screens never change):
;   off   - left alone, stretched with the screen
;   scale - stay where the server put them, with the shape they have at 16:9;
;           each panel narrows as one piece
;   box   - all of them inside a centred 16:9 area, exactly as at 16:9
Textdraws = scale


; ============================================================================
;  CAMERA
; ============================================================================

[Camera]
; Hor+: keep the original 4:3 height and see more at the sides (1), or crop
; the top and bottom on wide screens like the original game (0).
HorPlus = 1

; Field of view during gameplay, 0.5 to 2.0. Cutscenes keep their own.
; Also applies to sniper and camera zoom.
FOV = 1.0

; Draw the water at the far left and right of a wide view, which the original
; skips (water popping in and out at the screen edges). [restart]
WaterFix = 1

; Keep coronas (lights, sun) round instead of stretched. [restart]
RoundCoronas = 1


; ============================================================================
;  HUD
; ============================================================================

[HUD]
; Correct the HUD at all. [restart]
Enable = 1

; Size of the whole HUD, 0.25 to 4.0.
Scale = 1.0
; Extra width / height for the whole HUD, 0.25 to 4.0.
Width = 1.0
Height = 1.0

; Keep the HUD inside a centred area of this shape instead of at the screen
; edges, for ultrawide screens: 0 (the whole screen), 4:3, 16:10, 16:9, 21:9.
Area = 0

; Draw the weapon icon square, the way its picture is made. The original
; draws it taller than wide, even at 4:3.
SquareWeaponIcon = 1

; Also correct text and sprites drawn by scripts (minigames, mission screens).
; CLEO mods that draw their own HUD expect the stretched layout, so this is
; off by default. Never affects SA-MP textdraws. [restart]
ScriptDrawing = 0


; ----------------------------------------------------------------------------
;  HUD parts
; ----------------------------------------------------------------------------
;  Each part can be adjusted on its own:
;    Scale    size, on top of [HUD] Scale        (0.1 to 8.0)
;    Width    extra horizontal factor            (0.1 to 8.0)
;    OffsetX  move right (+) or left (-)         (pixels at 1080p)
;    OffsetY  move down (+) or up (-)            (pixels at 1080p)
;  Offsets are in pixels at 1080p, so the same values work at any resolution.

[HUD.Radar]
; Draw the radar as a circle. The original is a slightly wide oval, even at 4:3.
Round = 1
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

; Size only: moving it would separate it from where shots land.
[HUD.Crosshair]
Scale = 1.0
Width = 1.0

; Weapon, ammo, health, armour, breath, money and clock.
[HUD.PlayerInfo]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

[HUD.Wanted]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

; Mission timers and counters.
[HUD.Timers]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

; Area and vehicle names.
[HUD.ZoneNames]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

[HUD.MissionTitle]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

[HUD.HelpText]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

[HUD.Subtitles]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

; Big centred messages: mission passed / failed, wasted / busted, odd jobs,
; garages, rampages, trip skip.
[HUD.Messages]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0

[HUD.RadioName]
Scale = 1.0
Width = 1.0
OffsetX = 0
OffsetY = 0


; ============================================================================
;  MENUS AND SCREENS
; ============================================================================

[Menus]
; Correct the menus, map, loading screens and videos at all. [restart]
Enable = 1

; Menu layout:
;   edges    - menu in 4:3 proportions, titles and pictures at the screen edges
;   centered - the whole menu as one 4:3 block
;   stretch  - the original stretched menu
Layout = edges

; Like [HUD] Area, for the menu titles and pictures.
Area = 0

; The pause-menu map fills the width of the screen and shows more of the map,
; instead of the original 4:3 frame in the middle. [restart]
WideMap = 1

; Add the Widescreen Settings page to the game's menu. 0 leaves the game's menu
; pages alone (for conflicts with other menu mods); settings are then changed
; only in this file. Can't be changed from the page itself. [restart]
SettingsMenu = 1

; Keep the game visible behind the Widescreen Settings page, so changes show
; while you make them. [restart]
LivePreview = 1

; Full-screen pictures keep their own shape, so widescreen artwork mods are
; shown correctly too:
;   crop      - fill the screen, cutting off the top and bottom
;   pillarbox - show all of it, with black bars at the sides
;   stretch   - the original stretched picture
Backgrounds = crop
LoadingScreens = pillarbox

; Intro videos: pillarbox or stretch.
Videos = pillarbox


; ============================================================================
;  CUTSCENES
; ============================================================================

[Cutscenes]
; Black bars during cutscenes:
;   vanilla   - the original bars at the top and bottom
;   off       - no bars
;   pillarbox - also bars at the sides, showing exactly the picture the
;               original framed (no extra width from Hor+)
Bars = vanilla

; Height of the bars, 0.0 to 2.0.
BarSize = 1.0

; Seconds for the bars to slide in and out, 0 to 5. 0 = instant, like the original.
BarSlide = 0


; ============================================================================
;  STARTUP
; ============================================================================

[Startup]
; Skip the Rockstar logo and title videos. [restart]
SkipIntro = 0


; ============================================================================
;  TROUBLESHOOTING
; ============================================================================

[Debug]
; Write neufoxWidescreen.log next to the .asi: what was patched, what was
; skipped and why. Include it when reporting a problem. [restart]
Log = 0

; Re-read this file when it is saved while the game runs. [restart]
LiveReload = 1
